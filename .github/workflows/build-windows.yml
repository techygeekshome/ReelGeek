name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Work out the version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF -replace 'refs/tags/v',''
          } else {
            $v = '1.0.0'
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Building version $v"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pywebview

      - name: Fetch ffmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip' -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-tmp
          New-Item -ItemType Directory -Force -Path ffmpeg | Out-Null
          $exe = Get-ChildItem -Path ffmpeg-tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $exe) { throw 'ffmpeg.exe not found in the download' }
          Copy-Item $exe.FullName ffmpeg\ffmpeg.exe
          Write-Host ("ffmpeg is {0:N1} MB" -f ((Get-Item ffmpeg\ffmpeg.exe).Length / 1MB))

      - name: Make the icon
        run: python packaging/make_icon.py

      - name: Build the app
        run: pyinstaller packaging/reelgeek.spec --noconfirm --clean

      - name: Check the build actually starts
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist\ReelGeek\ReelGeek.exe')) { throw 'ReelGeek.exe was not produced' }
          if (-not (Test-Path 'dist\ReelGeek\_internal\ffmpeg\ffmpeg.exe')) { Write-Warning 'ffmpeg is not in the bundle' }
          if (-not (Test-Path 'dist\ReelGeek\_internal\reelgeek\ui.html')) { throw 'ui.html was not bundled' }
          $ui = Get-Content 'dist\ReelGeek\_internal\reelgeek\ui.html' -Raw
          if ($ui -notmatch 'btnAbout')     { throw 'the bundled UI has no About box' }
          if ($ui -notmatch 'checkUpdates') { throw 'the bundled UI has no update check' }
          if ($ui -match '[\u2013\u2014]') { throw 'the bundled UI contains a long dash' }
          $size = (Get-ChildItem dist\ReelGeek -Recurse | Measure-Object -Property Length -Sum).Sum / 1MB
          Write-Host ("Bundle is {0:N1} MB" -f $size)

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ steps.ver.outputs.version }} packaging\reelgeek.iss
          $inst = Get-Item packaging\Output\ReelGeekSetup.exe
          Write-Host ("Installer is {0:N1} MB" -f ($inst.Length / 1MB))

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: ReelGeek-Windows-${{ steps.ver.outputs.version }}
          path: packaging/Output/ReelGeekSetup.exe
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: packaging/Output/ReelGeekSetup.exe
